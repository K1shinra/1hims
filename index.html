<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payroll & Benefits Management System - Dr. Jose N. Rodriguez Memorial Hospital and Sanitarium</title>
  <meta name="description" content="Enterprise Hospital Information Management System (HIMS) Payroll & Benefits Management Module for Dr. Jose N. Rodriguez Memorial Hospital and Sanitarium (DJNRMHS) with AI-Assisted Anomaly Detection.">

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom Healthcare Enterprise Stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <!-- Fullscreen Login & Role Selection Interface (Shown when logged out) -->
  <div id="loginScreen" class="d-none"></div>

  <!-- Main Application Wrapper -->
  <div class="app-wrapper" id="appWrapper">
    <!-- Collapsible Sidebar -->
    <aside class="sidebar" id="appSidebar">
      <!-- Sidebar Brand -->
      <a href="javascript:void(0)" onclick="App.navigateTo('dashboard')" class="sidebar-brand">
        <div class="brand-icon-box">
          <i class="bi bi-hospital"></i>
        </div>
        <div class="brand-text ms-2">
          <h6>DJNRMHS HIMS</h6>
          <span>PAYROLL & BENEFITS</span>
        </div>
      </a>

      <!-- Sidebar Dynamic Menu Container (Populated by App.renderSidebar()) -->
      <div class="sidebar-menu" id="sidebarMenuContainer"></div>

      <!-- Sidebar User Footer Container (Populated dynamically) -->
      <div class="sidebar-footer" id="sidebarFooterContainer"></div>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper" id="mainWrapper">
      <!-- Fixed Topbar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn-sidebar-toggle" onclick="App.toggleSidebar()" title="Toggle Sidebar Navigation">
            <i class="bi bi-list"></i>
          </button>
          <div class="hospital-badge d-none d-md-flex">
            <i class="bi bi-shield-plus text-success"></i>
            <span>Dr. Jose N. Rodriguez Memorial Hospital (DJNRMHS)</span>
          </div>
        </div>

        <div class="topbar-search d-none d-lg-block">
          <i class="bi bi-search"></i>
          <input type="text" class="form-control" placeholder="Quick find employee, period, or claim..." onkeyup="if(event.key === 'Enter'){ if(App.isEmployee()){ App.navigateTo('payslip'); } else { App.navigateTo('payroll-list'); } }">
        </div>

        <div class="topbar-right">
          <!-- AI Alerts Quick Badge Button (Hidden for employees) -->
          <button class="topbar-btn d-none d-sm-inline-flex" onclick="if(App.isEmployee()){ App.navigateTo('claims'); } else { App.navigateTo('ai-anomalies'); }" title="AI Anomalies Detected">
            <i class="bi bi-robot text-danger"></i>
            <span class="topbar-badge-counter">4</span>
          </button>

          <!-- Notification Bell -->
          <button class="topbar-btn" onclick="App.showToast('All hospital compliance metrics and statutory parameters are up to date.', 'info')" title="Notifications">
            <i class="bi bi-bell"></i>
          </button>

          <!-- Dynamic User Dropdown & Quick Role Switcher Container -->
          <div class="dropdown d-flex align-items-center" id="topbarUserDropdownContainer"></div>
        </div>
      </header>

      <!-- Main Page Viewport -->
      <main class="page-content">
        <!-- Breadcrumb Bar -->
        <div class="breadcrumb-container">
          <ul class="custom-breadcrumb" id="appBreadcrumb">
            <li><a href="javascript:void(0)" onclick="App.navigateTo('dashboard')">HIMS Portal</a></li>
            <li class="active">Dashboard</li>
          </ul>
        </div>

        <!-- Dynamic View Content Injected Here -->
        <div id="mainContentArea">
          <!-- Rendered dynamically by Vanilla JS Router -->
        </div>
      </main>
    </div>
  </div>

  <!-- Global Application Modal -->
  <div class="modal fade" id="globalAppModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="globalModalTitle">Modal Title</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="globalModalBody">
          <!-- Dynamic Content -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light border" id="globalModalCancelBtn" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-hospital-primary" id="globalModalConfirmBtn">Confirm Action</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Global Toast Notification Container -->
  <div class="toast-container" id="globalToastContainer"></div>

  <!-- Bootstrap 5 JavaScript Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Chart.js for Dashboard Charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Core Data & Philippine Calculation Engine -->
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/payroll-calc.js"></script>

  <!-- Feature Modules -->
  <script src="/assets/js/modules/dashboard.js"></script>
  <script src="/assets/js/modules/payroll.js"></script>
  <script src="/assets/js/modules/compensation.js"></script>
  <script src="/assets/js/modules/benefits.js"></script>
  <script src="/assets/js/modules/claims.js"></script>
  <script src="/assets/js/modules/ai-anomaly.js"></script>
  <script src="/assets/js/modules/reports.js"></script>
  <script src="/assets/js/modules/settings.js"></script>

  <!-- Central App Coordinator & Router -->
  <script src="/assets/js/app.js"></script>
</body>
</html>
